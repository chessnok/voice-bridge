[project]
name = "voice-bridge"
version = "0.1.0"
description = "Голосовой ассистент для слабовидящего писателя: живой разговор + push-to-talk, агент с jail-папкой, docx, почта, браузер"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "pynput>=1.8",
    "openai>=2.0",
    "edge-tts>=7.0",
    "websockets>=15.0",
    "mcp>=1.2",
    "langfuse>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]

[tool.uv]
package = false
